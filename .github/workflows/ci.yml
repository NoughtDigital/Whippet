name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: npm audit (production)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint scripts
        run: npm run lint:scripts

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP CodeSniffer
        continue-on-error: true
        run: composer phpcs

      - name: Run PHPUnit
        run: composer test

      - name: Verify required runtime assets
        run: |
          test -f analytics/js/gtag.js
          test -f analytics/js/minimal-analytics.js
          test -f pages/whippet-pages.min.js
          test -f resources/js/vendor/alpine.min.js
          test -f js/editor.js
          test -f dist/css/admin.css
          test -f inc/minify.php
          test -f inc/cdn-rewrite.php
          test -f inc/speculative-loading.php
          test -f inc/lazy-render.php

      - name: Build assets
        run: npm run prod

      - name: Verify built admin assets
        run: |
          test -f dist/css/admin.css
          test -f dist/js/app.js
